<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: "Microsoft YaHei", sans-serif; width: 380px; margin: 0; padding: 14px 16px; background: #f5f6f8; font-size: 13px; }
  h1 { font-size: 15px; color: #0b3d66; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; color: #444; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c9d4de; border-radius: 6px; font-size: 12.5px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c9d4de; border-radius: 6px; font-size: 12.5px; background: #fff; }
  button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 8px; font-size: 13px; cursor: pointer; }
  #save { background: #0b3d66; color: #fff; width: 100%; }
  #run { background: #ff8c1a; color: #fff; width: 100%; margin-top: 6px; }
  #status { margin-top: 10px; padding: 8px 10px; background: #fff; border-radius: 8px; max-height: 160px; overflow-y: auto; font-size: 11.5px; color: #555; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
  .hint { color: #999; font-size: 11px; font-weight: normal; }
  details { margin-top: 10px; }
  summary { color: #0b3d66; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<h1>📺 知了 Reelize</h1>

<label for="modelProfile">视频与浏览日报使用的 API</label>
<select id="modelProfile" aria-describedby="modelStatus"><option value="">正在读取 API 配置…</option></select>
<div id="modelStatus" class="hint" style="line-height:1.7;margin-top:6px;"></div>
<button id="manageApi" style="width:100%;background:#e6f2ed;color:#167766;margin-top:8px;">管理 API · KeyDock</button>
<div class="hint" style="line-height:1.7;margin-top:6px;">首次使用请打开管理页，填写自己的 API Key 并选择模型 ID。个人 Key 默认仅存本次浏览器会话；可在管理页启用「加密保存」（保管密码加密存本机），重启后解锁即免重输。</div>
<div class="row">
  <div><label>监控平台</label>
    <select id="platform">
      <option value="bilibili">B 站</option>
      <option value="douyin">抖音</option>
    </select>
  </div>
</div>

<div id="biliAuthorField">
  <label>作者 UID <span class="hint">B 站空间 URL 里那串数字</span></label>
  <input id="uid" placeholder="98639326">
</div>
<div id="douyinAuthorField" style="display:none">
  <label>作者主页链接 <span class="hint">https://www.douyin.com/user/…（需已在 Edge 登录 douyin.com）</span></label>
  <input id="douyinAuthor" placeholder="https://www.douyin.com/user/MS4wLjABAAAA...">
</div>

<div class="row">
  <div><label>收件邮箱</label><input id="to" placeholder="xxx@qq.com"></div>
</div>
<div class="row">
  <div><label>发件邮箱</label><input id="from" placeholder="xxx@163.com"></div>
  <div><label>SMTP 授权码</label><input id="smtpPass" type="password" placeholder="授权码"></div>
</div>

<label>检查间隔</label>
<select id="intervalHours">
  <option value="1">每 1 小时</option>
  <option value="2">每 2 小时</option>
  <option value="3">每 3 小时</option>
  <option value="6" selected>每 6 小时（默认）</option>
  <option value="12">每 12 小时</option>
  <option value="24">每天 1 次（24 小时）</option>
  <option value="48">每 2 天 1 次（48 小时）</option>
</select>

<details>
  <summary>高级设置</summary>
  <label>SMTP 服务器 <span class="hint">留空按发件域名自动推断（163/qq/126/gmail）</span></label>
  <input id="smtpHost" placeholder="smtp.163.com">
  <label>SMTP 端口</label>
  <select id="smtpPort"><option value="465">465（TLS）</option><option value="587">587（STARTTLS）</option></select>
  <label>中继地址 <span class="hint">浏览器无法直连 SMTP，需一个 HTTPS→SMTP 中继（见 README，可免费自部署）</span></label>
  <input id="relayUrl" placeholder="https://your-worker.workers.dev">
  <div class="hint">预设中继仅支持 smtp.163.com；其他 SMTP 服务请使用自己的中继。邮箱和授权码由使用者填写。</div>
  <label>中继密钥 <span class="hint">与 Worker 的 ACCESS_KEY 一致，至少 24 个字符</span></label>
  <input id="relayKey" type="password" autocomplete="off" placeholder="请先在自己的 Worker 设置密钥">
</details>

<button id="openDayLog" style="width:100%;background:#e6edf8;color:#0b3d66">浏览日报 · 历史记录总结</button>
<label style="font-weight:normal"><input id="dailyEmailQuick" type="checkbox" style="width:auto"> 将浏览日报发送到邮箱</label>
<div class="hint">在日报设置中选择采集范围和每日生成时间；与视频邮件共用邮箱及中继。</div>
<label style="font-weight:normal"><input id="lecture" type="checkbox" style="width:auto"> 生成讲解页（随邮件附 lecture.html）</label>
<div class="hint">按 Manim 图文讲解风格多生成一页分步讲解网页：章节导航 + 讲解文案 + 视频截图插图，零依赖 HTML，可离线阅读。</div>
<button id="save">保存配置</button>
<button id="run">立即检查更新</button>
<button id="retryUnknown" hidden>已核对邮箱，重试未确认邮件（可能重复）</button>
<div id="queue" class="hint"></div>
<div id="status">就绪</div>

<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
